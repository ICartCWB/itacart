[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "itacart"
version = "0.1.0a4"
authors = [
  { name = "ITACaRT", email = "itacart@proton.me" },
]
maintainers = [
  { name = "Israel Nunes da Silva", email = "israelnunes@ita.br" },
]
description = "An Equal-Area Parallelogram DGGS for Terrestrial Cadastral Mapping-Designed for Usability and Blockchain Integration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dggs", "gis", "geospatial", "cadastre", "blockchain", "sdi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Runtime: shapely is the sole hard dependency (herdado de itacart_core).
# pyproj NAO entra: a projecao senoidal elipsoidal e implementada
# diretamente a partir das Eq. (1) e (2) do artigo.
dependencies = [
    "shapely>=2.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14"]          # interop.to_geodataframe
parallel = ["joblib>=1.3"]         # polyfill com n_jobs > 1
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.9",
    "pyproj>=3.6",                 # APENAS verificacao cruzada geodesica em testes
    "geopandas>=0.14",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5",
]

[project.urls]
Homepage = "https://github.com/ICartCWB/itacart"
Documentation = "https://itacart.readthedocs.io"
Repository = "https://github.com/ICartCWB/itacart"
Issues = "https://github.com/ICartCWB/itacart/issues"
Paper = "https://doi.org/10.14393/rbcv77n0a-79281"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itacart = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["itacart"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "conformance: OGC DGGS Core / EAERS conformance tests",
    "slow: tests that take more than a second",
    "crosscheck: tests validating against pyproj (dev-only dependency)",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
