name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: black
        run: black --check --diff src tests
      - name: isort
        run: isort --check-only --diff src tests
      - name: flake8
        run: flake8 src tests --max-line-length=88 --extend-ignore=E203,W503
      - name: mypy
        run: mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Coverage is instrumented on the one cell that uploads it. The
      # other eleven ran the same instrumentation and threw the report
      # away, which bought nothing and slowed every cell.
      #
      # The slow geometric tests are NOT deselected outside that cell.
      # They are what the matrix exists to catch: they are sensitive to
      # floating point, and running them on one platform would defeat
      # the point of having three.
      #
      # --doctest-modules runs alongside coverage rather than
      # everywhere, so that a docstring example is executed on every push
      # without changing what a bare `pytest` does locally. Both paths are
      # named: a bare `--doctest-modules src` would override the testpaths
      # setting and collect the four doctests and nothing else, which
      # passes green while running none of the suite.
      - name: pytest
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: pytest
      - name: pytest with coverage and doctests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest --doctest-modules src tests --cov=itacart --cov-report=xml
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: OGC DGGS Core / EAERS conformance suite
        run: pytest -m conformance -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
